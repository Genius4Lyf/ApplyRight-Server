    <meta name="title" property="og:title" content="Senior Compute System Software Engineer">
    <meta name="description" property="og:description" content="NVIDIA GPUs have ignited a new era of computing with the advent of AI, for which the GPU acts as the brain of computers. Robotics, self-driving cars, industrial automation, and many other domains benefit from the computing power of GPUs. The high-quality and robust GPU software stack simplifies the realization of complex use cases. This has been possible because of the amazing group of people working here at NVIDIA who made this happen. As we shift gears with the GenAI revolution and are going more towards GenAI assisted design and development, we are also taking up on solving some of the challenges that come with it. Formal verification of GenAI produced contents remains one of the important challenges. We are now looking for a Senior System Software Engineer in the Compute System software team to work on defining and bootstrapping initiatives for formal verification of the SW architecture and design of the user mode drivers that interact with GPU, DLA and other Tegra compute engines. What you’ll be doing: You will be involved in the definition, architectural design and analysis, and development of groundbreaking functional safety software, with an opportunity to shape the future of parallel computation on GPUs as well as DLA and other engines. Bootstrap initiatives in defining and laying down the company wide process for formal verification. Inculcate a culture of high quality software development in the team, mentor other engineers What we need to see: BS/MS/PhD degree in Computer Science or related field or equivalent experience Passionate about high quality software engineering, and a desire to contribute towards creating better software Deep understanding of computer architecture, OS fundamentals Solid background in formal verification methodologies, functional programming Hands on experience with LEAN4, TLA+, Haskell, Coq/Rocq or related paradigms 12+ years of proven experience in complex software development, design, and analysis Strong teammate; self-motivated and good demeanor A strong desire to learn, grow and create Ways to stand out from the crowd: Background with Parallel Programming, particularly in CUDA, OpenCL, or Renderscript Previous experience working on Deep learning frameworks including Pytorch, TensorFlow, ONNX Prior experience in working on special purpose or fixed functionality HW like DLA, NPU, ISP, DSP. Prior experience in Formal verification, functional programming, LEAN4, TLA+, Haskell in a production software development environment Prior experience with developing safety critical software, or hardening and taking complex software through software audits NVIDIA is committed to cultivating a diverse work environment and proud to be an equal opportunity employer. As we highly value diversity in our current and future employees, we do not discriminate (including in our hiring and promotion practices) on the basis of race, religion, color, national origin, gender, gender expression, sexual orientation, age, marital status, veteran status, disability status or any other characteristic protected by law. NVIDIA pioneered accelerated computing. Today, our AI infrastructure powers global intelligence, transforming every industry. Learn more about NVIDIA.">
